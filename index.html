<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Stock</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f5f7;color:#1e293b;max-width:700px;margin:auto}
  .header-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:22px;margin:0;color:#0f172a}
  .sub{color:#64748b;font-size:14px;margin-bottom:16px}
  .label-title{font-weight:600;font-size:14px;margin-bottom:6px;display:block;color:#334155}
  select, input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;margin-bottom:14px}
  
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid #e2e8f0}
  .card-header{display:flex;justify-content:space-between;align-items:flex-start}
  .prod-name{font-size:18px;font-weight:bold;color:#0f172a}
  .prod-dep{font-size:13px;color:#64748b;margin-top:2px}
  .prod-qty{font-size:24px;font-weight:bold;color:#16a34a;text-align:right}
  .qty-label{font-size:11px;color:#64748b;font-weight:normal;display:block}
  
  .qty-control{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 10px}
  .qty-control input{text-align:center;font-size:20px;font-weight:bold;width:120px;margin:0;padding:8px}
  
  .btn-action{flex:1;padding:12px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
  .btn-sumar{background:#16a34a;color:#fff}
  .btn-restar{background:#fff;color:#dc2626;border:1px solid #fecaca}
  .row-btns{display:flex;gap:10px}

  .details-toggle{background:none;border:none;color:#2563eb;font-size:13px;cursor:pointer;padding:4px 0;margin-top:6px;text-align:left}
  .extra-details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1;font-size:13px;color:#475569}
  
  .btn-refresh{background:#fff;border:1px solid #cbd5e1;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
  #msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:1000}
  
  .add-section{background:#fff;padding:16px;border-radius:12px;margin-top:24px;border:1px solid #e2e8f0}
  .btn-main{background:#2563eb;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

  <div class="header-flex">
    <div>
      <h1>Control de depósitos</h1>
      <div class="sub">Buscá un producto y sumá o restá unidades.</div>
    </div>
    <button class="btn-refresh" onclick="cargar()">🔄 Actualizar</button>
  </div>

  <div id="msg"></div>

  <label class="label-title">Depósito</label>
  <select id="filtroDep" onchange="dibujar()">
    <option value="todos">Todos los depósitos</option>
  </select>

  <label class="label-title">Buscar producto</label>
  <input id="buscar" placeholder="Ej: codo 20" oninput="dibujar()">

  <div id="contadorProd" style="font-size:13px;color:#64748b;margin-bottom:12px;"></div>

  <div id="lista-tarjetas"></div>

  <div class="add-section">
    <h3 style="margin-top:0;font-size:16px;color:#0f172a">➕ Agregar Producto Nuevo</h3>
    <form id="formAdd"></form>
  </div>

<script>
  // ====== CONFIGURACIÓN ======
  const URL_API = 'https://script.google.com/macros/s/AKfycbxHOV5_JvaI8SQNngLMVFm61qKBinAWNuYvECYeyNU9SjH2xd4isOV3W4616ShN4hurog/exec'; // Tu URL /exec
  const CLAVE   = 'Benz';              

  let encabezados = [], filas = [], depositos = [];
  
  function mostrarMsg(t) {
    const m = document.getElementById('msg');
    m.textContent = t;
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 3000);
  }

  async function cargar() {
    mostrarMsg('Cargando datos...');
    try {
      const r = await fetch(URL_API + '?clave=' + encodeURIComponent(CLAVE));
      const j = await r.json();
      if (!j.ok) return alert('Error: ' + j.error);
      encabezados = j.encabezados;
      filas = j.datos;
      depositos = j.depositos || [];
      
      actualizarSelectDepositos();
      armarFormularioAgregar();
      dibujar();
      mostrarMsg('¡Datos actualizados ✔!');
    } catch (e) {
      alert('No se pudo conectar: ' + e);
    }
  }

  function actualizarSelectDepositos() {
    const sel = document.getElementById('filtroDep');
    const actual = sel.value;
    sel.innerHTML = '<option value="todos">Todos los depósitos</option>';
    depositos.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });
    sel.value = actual;
  }

  async function enviar(datos) {
    mostrarMsg('Guardando...');
    try {
      const r = await fetch(URL_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ clave: CLAVE, ...datos })
      });
      const j = await r.json();
      if (!j.ok) { alert('Error: ' + j.error); return false; }
      mostrarMsg('Guardado con éxito ✔');
      return true;
    } catch (e) {
      alert('Error de red: ' + e);
      return false;
    }
  }

  function dibujar() {
    const q = document.getElementById('buscar').value.toLowerCase();
    const depFiltro = document.getElementById('filtroDep').value;
    const contenedor = document.getElementById('lista-tarjetas');
    contenedor.innerHTML = '';

    // Encontrar nombres de columnas clave
    const hProd = encabezados.find(h => h.toLowerCase().includes('producto')) || encabezados[0];
    const hDep = encabezados.find(h => h.toLowerCase().includes('depósito') || h.toLowerCase().includes('deposito')) || encabezados[1];
    const hCant = encabezados.find(h => h.toLowerCase().includes('cantidad')) || encabezados[2];

    const filtradas = filas.filter(f => {
      const textoCoincide = encabezados.some(h => String(f[h] || '').toLowerCase().includes(q));
      const depCoincide = (depFiltro === 'todos' || String(f[hDep] || '').trim() === depFiltro);
      return textoCoincide && depCoincide;
    });

    document.getElementById('contadorProd').textContent = filtradas.length + ' productos encontrados';

    filtradas.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';

      // Cabecera de la tarjeta
      const header = document.createElement('div');
      header.className = 'card-header';
      
      const info = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'prod-name';
      title.textContent = f[hProd] || 'Sin nombre';
      
      const subtitle = document.createElement('div');
      subtitle.className = 'prod-dep';
      subtitle.textContent = f[hDep] || 'Sin depósito';
      
      info.appendChild(title);
      info.appendChild(subtitle);

      const qtyDiv = document.createElement('div');
      qtyDiv.className = 'prod-qty';
      qtyDiv.innerHTML = `${f[hCant] || 0} <span class="qty-label">unidades</span>`;

      header.appendChild(info);
      header.appendChild(qtyDiv);
      card.appendChild(header);

      // Control central de cantidades (+ / -)
      const qtyControl = document.createElement('div');
      qtyControl.className = 'qty-control';
      
      const inputCant = document.createElement('input');
      inputCant.type = 'number';
      inputCant.value = '1';
      inputCant.min = '1';
      qtyControl.appendChild(inputCant);
      card.appendChild(qtyControl);

      const rowBtns = document.createElement('div');
      rowBtns.className = 'row-btns';

      const btnRestar = document.createElement('button');
      btnRestar.className = 'btn-action btn-restar';
      btnRestar.textContent = '- Restar';
      btnRestar.onclick = async () => {
        const val = Number(inputCant.value);
        if (val > 0 && await enviar({ accion: 'sumar_restar', fila: f.fila, cantidad: -val })) cargar();
      };

      const btnSumar = document.createElement('button');
      btnSumar.className = 'btn-action btn-sumar';
      btnSumar.textContent = '+ Sumar';
      btnSumar.onclick = async () => {
        const val = Number(inputCant.value);
        if (val > 0 && await enviar({ accion: 'sumar_restar', fila: f.fila, cantidad: val })) cargar();
      };

      rowBtns.appendChild(btnRestar);
      rowBtns.appendChild(btnSumar);
      card.appendChild(rowBtns);

      // Más opciones (Editar campos o Borrar)
      const toggle = document.createElement('button');
      toggle.className = 'details-toggle';
      toggle.textContent = '▶ Más opciones (Editar / Borrar)';
      
      const extra = document.createElement('div');
      extra.className = 'extra-details';

      toggle.onclick = () => {
        const visible = extra.style.display === 'block';
        extra.style.display = visible ? 'none' : 'block';
        toggle.textContent = visible ? '▶ Más opciones (Editar / Borrar)' : '▼ Ocultar opciones';
      };

      // Campos editables individuales
      encabezados.forEach((h, i) => {
        const label = document.createElement('label');
        label.style.fontSize = '12px';
        label.style.display = 'block';
        label.style.marginTop = '6px';
        label.textContent = h;

        const inp = document.createElement('input');
        inp.value = f[h] || '';
        inp.style.marginBottom = '6px';
        
        // Si es la columna de depósito en el formulario de edición, la convertimos en un select con los depósitos existentes para evitar errores
        if (h.toLowerCase().includes('depósito') || h.toLowerCase().includes('deposito')) {
          const selDep = document.createElement('select');
          selDep.style.marginBottom = '6px';
          depositos.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === f[h]) opt.selected = true;
            selDep.appendChild(opt);
          });
          selDep.onchange = () => enviar({ accion: 'actualizar', fila: f.fila, columna: i + 1, valor: selDep.value });
          extra.appendChild(label);
          extra.appendChild(selDep);
        } else {
          inp.onchange = () => enviar({ accion: 'actualizar', fila: f.fila, columna: i + 1, valor: inp.value });
          extra.appendChild(label);
          extra.appendChild(inp);
        }
      });

      const btnDel = document.createElement('button');
      btnDel.style.background = '#dc2626';
      btnDel.style.color = '#fff';
      btnDel.style.width = '100%';
      btnDel.style.padding = '10px';
      btnDel.style.border = 'none';
      btnDel.style.borderRadius = '6px';
      btnDel.style.marginTop = '10px';
      btnDel.style.cursor = 'pointer';
      btnDel.style.fontWeight = 'bold';
      btnDel.textContent = '🗑 Eliminar Producto';
      btnDel.onclick = async () => {
        if (confirm('¿Seguro que deseas eliminar este producto?') && await enviar({ accion: 'borrar', fila: f.fila })) cargar();
      };
      extra.appendChild(btnDel);

      card.appendChild(toggle);
      card.appendChild(extra);
      contenedor.appendChild(card);
    });
  }

  function armarFormularioAgregar() {
    const form = document.getElementById('formAdd');
    form.innerHTML = '';
    
    encabezados.forEach(h => {
      const label = document.createElement('label');
      label.className = 'label-title';
      label.textContent = h;
      form.appendChild(label);

      // Si el encabezado es el depósito, generamos un desplegable con los depósitos existentes
      if (h.toLowerCase().includes('depósito') || h.toLowerCase().includes('deposito')) {
        const select = document.createElement('select');
        select.name = h;
        depositos.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          select.appendChild(opt);
        });
        form.appendChild(select);
      } else {
        const inp = document.createElement('input');
        inp.placeholder = 'Ingrese ' + h;
        inp.name = h;
        if (h.toLowerCase().includes('cantidad')) {
          inp.type = 'number';
          inp.value = '0';
        }
        form.appendChild(inp);
      }
    });

    const b = document.createElement('button');
    b.type = 'submit';
    b.className = 'btn-main';
    b.textContent = '💾 Guardar Nuevo Producto';
    form.appendChild(b);

    form.onsubmit = async e => {
      e.preventDefault();
      const valores = encabezados.map(h => {
        const elem = e.target.elements[h];
        return elem ? elem.value : '';
      });
      if (await enviar({ accion: 'agregar', valores })) {
        form.reset();
        cargar();
      }
    };
  }

  cargar();
</script>
</body>
</html>
