<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Stock</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f5f7;color:#1e293b;max-width:700px;margin:auto}
  .header-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  h1{font-size:22px;margin:0;color:#0f172a}
  .sub{color:#64748b;font-size:14px;margin-bottom:4px}
  .label-title{font-weight:600;font-size:14px;margin-bottom:6px;display:block;color:#334155}
  select, input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;margin-bottom:14px}

  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid #e2e8f0}
  .card.bajo{border-left:6px solid #f59e0b}
  .card.cero{border-left:6px solid #dc2626}
  .card-header{display:flex;justify-content:space-between;align-items:flex-start}
  .prod-name{font-size:18px;font-weight:bold;color:#0f172a}
  .prod-dep{font-size:13px;color:#64748b;margin-top:2px}
  .card.bajo .prod-dep{color:#b45309;font-weight:600}
  .card.cero .prod-dep{color:#b91c1c;font-weight:600}
  .prod-qty{font-size:24px;font-weight:bold;color:#16a34a;text-align:right}
  .card.bajo .prod-qty{color:#d97706}
  .card.cero .prod-qty{color:#dc2626}
  .qty-label{font-size:11px;color:#64748b;font-weight:normal;display:block}

  .qty-control{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 10px}
  .qty-control input{text-align:center;font-size:20px;font-weight:bold;width:120px;margin:0;padding:8px}

  .btn-action{flex:1;padding:12px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
  .btn-sumar{background:#16a34a;color:#fff}
  .btn-restar{background:#fff;color:#dc2626;border:1px solid #fecaca}
  .row-btns{display:flex;gap:10px}

  .details-toggle{background:none;border:none;color:#2563eb;font-size:13px;cursor:pointer;padding:4px 0;margin-top:6px;text-align:left}
  .extra-details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1;font-size:13px;color:#475569}

  .btn-refresh{background:#fff;border:1px solid #cbd5e1;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
  #msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:1000}

  .add-section{background:#fff;padding:16px;border-radius:12px;margin-top:24px;border:1px solid #e2e8f0}
  .btn-main{background:#2563eb;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}

  /* --- NUEVO: pestañas, reposición, historial, archivados --- */
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:10px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;color:#334155}
  .tab.activo{background:#0f172a;color:#fff;border-color:#0f172a}
  .filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .btn-chip{flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid #fcd34d;background:#fffbeb;color:#92400e;font-weight:700;font-size:14px;cursor:pointer}
  .btn-chip.activo{background:#f59e0b;color:#fff;border-color:#f59e0b}
  .btn-undo{width:100%;padding:12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:14px}
  .mov{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
  .mov-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .mov-prod{font-weight:700;font-size:15px}
  .mov-meta{font-size:12px;color:#64748b;margin-top:3px}
  .mov-cant{font-weight:800;font-size:18px;white-space:nowrap}
  .mov-cant.mas{color:#16a34a}
  .mov-cant.menos{color:#dc2626}
  .mov.anulado{opacity:.55}
  .mov.anulado .mov-prod{text-decoration:line-through}
  .badge{display:inline-block;font-size:11px;background:#e2e8f0;color:#334155;border-radius:6px;padding:2px 6px;margin-left:6px}
  .btn-mini{margin-top:8px;padding:6px 12px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;font-size:13px}
  .card.inactivo{opacity:.75;background:#f8fafc;border-style:dashed}
  .btn-gris{border-color:#cbd5e1;background:#fff;color:#334155}
  .btn-gris.activo{background:#334155;color:#fff;border-color:#334155}
  .btn-arch{width:100%;padding:10px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;margin-top:10px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

  <div class="header-flex">
    <div>
      <h1>Control de depósitos</h1>
      <div class="sub">Buscá un producto y sumá o restá unidades.</div>
    </div>
    <button class="btn-refresh" onclick="actualizarTodo()">🔄 Actualizar</button>
  </div>

  <div id="msg"></div>

  <div class="tabs">
    <button class="tab activo" id="tabStock" onclick="setVista('stock')">📦 Stock</button>
    <button class="tab" id="tabHist" onclick="setVista('historial')">🕘 Historial</button>
  </div>

  <div id="vistaStock">
    <label class="label-title">Depósito</label>
    <select id="filtroDep" onchange="dibujar()">
      <option value="todos">Todos los depósitos</option>
    </select>

    <label class="label-title">Buscar producto</label>
    <input id="buscar" placeholder="Ej: codo 20" oninput="dibujar()">

    <div class="filtros">
      <button class="btn-chip" id="btnReponer" onclick="toggleReponer()">⚠️ Reponer (0)</button>
      <button class="btn-chip btn-gris" id="btnArchivados" onclick="toggleArchivados()">📦 Ver archivados (0)</button>
    </div>

    <div id="contadorProd" style="font-size:13px;color:#64748b;margin-bottom:12px;"></div>

    <div id="lista-tarjetas"></div>

    <div class="add-section">
      <h3 style="margin-top:0;font-size:16px;color:#0f172a">➕ Agregar Producto Nuevo</h3>
      <form id="formAdd"></form>
    </div>
  </div>

  <div id="vistaHistorial" style="display:none">
    <button class="btn-undo" onclick="deshacerUltimo()">↩ Deshacer último movimiento</button>
    <div id="lista-historial"></div>
  </div>

<script>
  // ====== CONFIGURACIÓN ======
  const URL_API = 'https://script.google.com/macros/s/AKfycbxHOV5_JvaI8SQNngLMVFm61qKBinAWNuYvECYeyNU9SjH2xd4isOV3W4616ShN4hurog/exec';
  // La app abre directo, sin clave ni nombre. La clave de administrador (para eliminar definitivamente) se pide solo en ese momento y no se guarda.

  let encabezados = [], filas = [], depositos = [], historial = [];
  let hProd = '', hDep = '', hCant = '', hMin = '', hEst = '';
  let soloReponer = false, verArchivados = false;

  function mostrarMsg(t) {
    const m = document.getElementById('msg');
    m.textContent = t;
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 3000);
  }

  // ----- llamadas al servidor -----
  async function api(params) {
    const q = new URLSearchParams(Object.assign({ accion: 'datos' }, params || {}));
    const r = await fetch(URL_API + '?' + q.toString());
    return r.json();
  }

  async function enviar(datos) {
    mostrarMsg('Guardando...');
    try {
      const r = await fetch(URL_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      });
      const j = await r.json();
      if (!j.ok) {
        alert('Error: ' + j.error);
        return false;
      }
      mostrarMsg('Guardado con éxito ✔');
      return true;
    } catch (e) {
      alert('Error de red: ' + e);
      return false;
    }
  }

  // ----- carga de datos -----
  async function cargar() {
    mostrarMsg('Cargando datos...');
    try {
      const j = await api();
      if (!j.ok) {
        alert('Error: ' + j.error);
        return false;
      }
      aplicarDatos(j);
      mostrarMsg('¡Datos actualizados ✔!');
      return true;
    } catch (e) {
      alert('No se pudo conectar: ' + e);
      return false;
    }
  }

  function aplicarDatos(j) {
    encabezados = j.encabezados;
    filas = j.datos;
    depositos = j.depositos || [];
    hProd = encabezados.find(h => String(h).toLowerCase().includes('producto')) || encabezados[0];
    hDep = encabezados.find(h => /dep[oó]sito/i.test(h)) || encabezados[1];
    hCant = encabezados.find(h => String(h).toLowerCase().includes('cantidad')) || encabezados[2];
    hMin = encabezados.find(h => /m[ií]nimo/i.test(h)) || '';
    hEst = encabezados.find(h => /estado/i.test(h)) || '';
    actualizarSelectDepositos();
    armarFormularioAgregar();
    dibujar();
  }

  async function actualizarTodo() {
    await cargar();
    if (document.getElementById('vistaHistorial').style.display !== 'none') cargarHistorial();
  }

  function actualizarSelectDepositos() {
    const sel = document.getElementById('filtroDep');
    const actual = sel.value;
    sel.innerHTML = '<option value="todos">Todos los depósitos</option>';
    depositos.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });
    sel.value = actual;
  }

  // ----- reposición -----
  function minDe(f) {
    if (!hMin) return 0;
    const n = Number(f[hMin]);
    return isNaN(n) ? 0 : n;
  }
  function esInactivo(f) {
    return !!hEst && String(f[hEst] || '').trim().toLowerCase() === 'inactivo';
  }
  function esBajo(f) {
    const m = minDe(f);
    return !esInactivo(f) && m > 0 && (Number(f[hCant]) || 0) <= m;
  }
  function toggleArchivados() {
    verArchivados = !verArchivados;
    dibujar();
  }
  async function cambiarEstado(f, valor) {
    const txt = valor === 'Inactivo'
      ? '¿Archivar este producto?\n\nQueda guardado pero oculto de la lista, y lo podés reactivar cuando quieras.'
      : '¿Reactivar este producto?';
    if (!confirm(txt)) return;
    if (await enviar({ accion: 'estado', fila: f.fila, producto: f[hProd], valor: valor })) cargar();
  }
  function toggleReponer() {
    soloReponer = !soloReponer;
    dibujar();
  }
  function bajosDelFiltro() {
    const depFiltro = document.getElementById('filtroDep').value;
    return filas.filter(f => esBajo(f) && (depFiltro === 'todos' || String(f[hDep] || '').trim() === depFiltro));
  }

  // ----- pestañas -----
  function setVista(v) {
    document.getElementById('vistaStock').style.display = v === 'stock' ? 'block' : 'none';
    document.getElementById('vistaHistorial').style.display = v === 'historial' ? 'block' : 'none';
    document.getElementById('tabStock').classList.toggle('activo', v === 'stock');
    document.getElementById('tabHist').classList.toggle('activo', v === 'historial');
    if (v === 'historial') cargarHistorial();
  }

  // ----- historial y deshacer -----
  async function cargarHistorial() {
    const cont = document.getElementById('lista-historial');
    cont.textContent = 'Cargando...';
    try {
      const j = await api({ accion: 'historial', limite: 80 });
      if (!j.ok) {
        cont.textContent = 'Error: ' + j.error;
        return;
      }
      historial = j.datos || [];
      dibujarHistorial();
    } catch (e) {
      cont.textContent = 'No se pudo conectar: ' + e;
    }
  }

  function puedeDeshacer(m) {
    return !m.estado && ['Entrada', 'Salida', 'Ajuste'].indexOf(m.tipo) >= 0;
  }

  function textoCantidad(m) {
    const n = Number(m.cantidad) || 0;
    if (m.tipo === 'Entrada') return { t: '+' + n, c: 'mas' };
    if (m.tipo === 'Salida') return { t: '−' + n, c: 'menos' };
    if (m.tipo === 'Ajuste') return { t: (n > 0 ? '+' : '') + n, c: n >= 0 ? 'mas' : 'menos' };
    if (m.tipo === 'Baja') return { t: n + ' u.', c: 'menos' };
    return { t: n + ' u.', c: '' };
  }

  function dibujarHistorial() {
    const cont = document.getElementById('lista-historial');
    cont.innerHTML = '';
    if (!historial.length) { cont.textContent = 'Todavía no hay movimientos.'; return; }
    const ICONOS = { Entrada: '🟢', Salida: '🔴', Ajuste: '✏️', Baja: '🗑', Archivado: '📦', Reactivado: '♻️' };
    historial.forEach(m => {
      const box = document.createElement('div');
      box.className = 'mov' + ((m.estado === 'Deshecho') ? ' anulado' : '');

      const top = document.createElement('div');
      top.className = 'mov-top';

      const izq = document.createElement('div');
      const prod = document.createElement('div');
      prod.className = 'mov-prod';
      prod.textContent = (ICONOS[m.tipo] || '•') + ' ' + m.producto;
      if (m.estado) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = m.estado;
        prod.appendChild(b);
      }
      const meta = document.createElement('div');
      meta.className = 'mov-meta';
      meta.textContent = m.deposito + ' · ' + m.fecha + (m.motivo ? ' · ' + m.motivo : '');
      izq.appendChild(prod);
      izq.appendChild(meta);

      const q = textoCantidad(m);
      const der = document.createElement('div');
      der.className = 'mov-cant ' + q.c;
      der.textContent = q.t;

      top.appendChild(izq);
      top.appendChild(der);
      box.appendChild(top);

      if (puedeDeshacer(m)) {
        const bt = document.createElement('button');
        bt.className = 'btn-mini';
        bt.textContent = '↩ Deshacer';
        bt.onclick = () => deshacer(m);
        box.appendChild(bt);
      }
      cont.appendChild(box);
    });
  }

  async function deshacer(m) {
    const q = textoCantidad(m);
    if (!confirm('¿Deshacer este movimiento?\n\n' + m.producto + ' (' + m.deposito + ')\n' + m.tipo + ' ' + q.t)) return;
    if (await enviar({ accion: 'deshacer', id: m.id })) {
      await cargarHistorial();
      cargar();
    }
  }

  function deshacerUltimo() {
    const m = historial.find(puedeDeshacer);
    if (!m) { alert('No hay movimientos para deshacer.'); return; }
    deshacer(m);
  }

  // ----- pantalla de stock -----
  function dibujar() {
    // Búsqueda inteligente (Tokenizada y sin tildes)
    const rawQuery = document.getElementById('buscar').value.toLowerCase().trim();
    const tokens = rawQuery.normalize('NFD').replace(/[̀-ͯ]/g, "").split(/\s+/).filter(Boolean);

    const depFiltro = document.getElementById('filtroDep').value;
    const contenedor = document.getElementById('lista-tarjetas');
    contenedor.innerHTML = '';

    // botón Reponer
    const nArch = filas.filter(esInactivo).length;
    const btnArch = document.getElementById('btnArchivados');
    btnArch.textContent = '📦 Ver archivados (' + nArch + ')';
    btnArch.classList.toggle('activo', verArchivados);
    btnArch.style.display = (nArch > 0 || verArchivados) ? 'block' : 'none';
    const nBajos = bajosDelFiltro().length;
    const btnRep = document.getElementById('btnReponer');
    btnRep.textContent = '⚠️ Reponer (' + nBajos + ')';
    btnRep.classList.toggle('activo', soloReponer);

    const filtradas = filas.filter(f => {
      const textoFila = encabezados.filter(h => h !== hMin && h !== hEst).map(h => String(f[h] || '')).join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, "");
      const textoCoincide = tokens.every(token => textoFila.includes(token));

      const depCoincide = (depFiltro === 'todos' || String(f[hDep] || '').trim() === depFiltro);
      const repCoincide = !soloReponer || esBajo(f);
      const estCoincide = verArchivados ? esInactivo(f) : !esInactivo(f);
      return textoCoincide && depCoincide && repCoincide && estCoincide;
    });

    document.getElementById('contadorProd').textContent = filtradas.length + ' productos encontrados';

    filtradas.forEach(f => {
      const bajo = esBajo(f);
      const cero = bajo && (Number(f[hCant]) || 0) === 0;
      const card = document.createElement('div');
      const inactivo = esInactivo(f);
      card.className = 'card' + (inactivo ? ' inactivo' : (cero ? ' cero' : (bajo ? ' bajo' : '')));

      const header = document.createElement('div');
      header.className = 'card-header';

      const info = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'prod-name';
      title.textContent = f[hProd] || 'Sin nombre';

      const subtitle = document.createElement('div');
      subtitle.className = 'prod-dep';
      subtitle.textContent = (f[hDep] || 'Sin depósito') + (inactivo ? ' · 📦 Archivado' : (bajo ? ' · ⚠️ ' + (cero ? 'Sin stock' : 'Stock bajo') + ' (mínimo ' + minDe(f) + ')' : ''));

      info.appendChild(title);
      info.appendChild(subtitle);

      const qtyDiv = document.createElement('div');
      qtyDiv.className = 'prod-qty';
      const qNum = document.createElement('span');
      qNum.textContent = f[hCant] || 0;
      const qLabel = document.createElement('span');
      qLabel.className = 'qty-label';
      qLabel.textContent = 'unidades';
      qtyDiv.appendChild(qNum);
      qtyDiv.appendChild(qLabel);

      header.appendChild(info);
      header.appendChild(qtyDiv);
      card.appendChild(header);

      const qtyControl = document.createElement('div');
      qtyControl.className = 'qty-control';

      const inputCant = document.createElement('input');
      inputCant.type = 'number';
      inputCant.value = '1';
      inputCant.min = '1';
      qtyControl.appendChild(inputCant);
      if (!inactivo) card.appendChild(qtyControl);

      const rowBtns = document.createElement('div');
      rowBtns.className = 'row-btns';

      const btnRestar = document.createElement('button');
      btnRestar.className = 'btn-action btn-restar';
      btnRestar.textContent = '- Restar';
      btnRestar.onclick = async () => {
        const val = Number(inputCant.value);
        if (val > 0 && await enviar({ accion: 'sumar_restar', fila: f.fila, producto: f[hProd], cantidad: -val })) cargar();
      };

      const btnSumar = document.createElement('button');
      btnSumar.className = 'btn-action btn-sumar';
      btnSumar.textContent = '+ Sumar';
      btnSumar.onclick = async () => {
        const val = Number(inputCant.value);
        if (val > 0 && await enviar({ accion: 'sumar_restar', fila: f.fila, producto: f[hProd], cantidad: val })) cargar();
      };

      rowBtns.appendChild(btnRestar);
      rowBtns.appendChild(btnSumar);
      if (!inactivo) card.appendChild(rowBtns);

      const toggle = document.createElement('button');
      toggle.className = 'details-toggle';
      toggle.textContent = '▶ Más opciones (Editar / Archivar / Eliminar)';

      const extra = document.createElement('div');
      extra.className = 'extra-details';

      toggle.onclick = () => {
        const visible = extra.style.display === 'block';
        extra.style.display = visible ? 'none' : 'block';
        toggle.textContent = visible ? '▶ Más opciones (Editar / Archivar / Eliminar)' : '▼ Ocultar opciones';
      };

      encabezados.forEach((h, i) => {
        if (h === hEst) return; // el estado se maneja con Archivar / Reactivar
        const label = document.createElement('label');
        label.style.fontSize = '12px';
        label.style.display = 'block';
        label.style.marginTop = '6px';
        label.textContent = (h === hMin) ? h + ' (avisa cuando el stock llega a este número)' : h;

        const esNumerico = (h === hCant || h === hMin);

        // guarda un cambio; si tocó cantidad o mínimo, recarga para ver alertas/colores al instante
        const guardar = async (valor) => {
          if (await enviar({ accion: 'actualizar', fila: f.fila, columna: i + 1, valor: valor, producto: f[hProd] })) {
            f[h] = valor;
            if (esNumerico) cargar();
          }
        };

        if (/dep[oó]sito/i.test(h)) {
          const selDep = document.createElement('select');
          selDep.style.marginBottom = '6px';
          depositos.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === f[h]) opt.selected = true;
            selDep.appendChild(opt);
          });
          selDep.onchange = () => guardar(selDep.value);
          extra.appendChild(label);
          extra.appendChild(selDep);
        } else {
          const inp = document.createElement('input');
          inp.value = f[h] === undefined || f[h] === null ? '' : f[h];
          inp.style.marginBottom = '6px';
          if (esNumerico) { inp.type = 'number'; inp.min = '0'; }
          inp.onchange = () => guardar(esNumerico ? Number(inp.value) : inp.value);
          extra.appendChild(label);
          extra.appendChild(inp);
        }
      });

      const btnArc = document.createElement('button');
      btnArc.className = 'btn-arch';
      btnArc.textContent = inactivo ? '♻️ Reactivar producto' : '📦 Archivar (dejar inactivo)';
      btnArc.onclick = () => cambiarEstado(f, inactivo ? 'Activo' : 'Inactivo');
      extra.appendChild(btnArc);

      const btnDel = document.createElement('button');
      btnDel.style.background = '#dc2626';
      btnDel.style.color = '#fff';
      btnDel.style.width = '100%';
      btnDel.style.padding = '10px';
      btnDel.style.border = 'none';
      btnDel.style.borderRadius = '6px';
      btnDel.style.marginTop = '10px';
      btnDel.style.cursor = 'pointer';
      btnDel.style.fontWeight = 'bold';
      btnDel.textContent = '🗑 Eliminar definitivamente (pide clave)';
      btnDel.onclick = async () => {
        if (!confirm('¿Eliminar DEFINITIVAMENTE este producto?\n\nNo se puede deshacer. Si solo querés sacarlo de la lista, usá "Archivar".')) return;
        const claveAdmin = prompt('Clave de administrador para eliminar definitivamente:');
        if (!claveAdmin) return;
        if (await enviar({ accion: 'borrar', fila: f.fila, producto: f[hProd], claveAdmin: claveAdmin })) cargar();
      };
      extra.appendChild(btnDel);

      card.appendChild(toggle);
      card.appendChild(extra);
      contenedor.appendChild(card);
    });
  }

  function armarFormularioAgregar() {
    const form = document.getElementById('formAdd');
    form.innerHTML = '';

    encabezados.forEach(h => {
      if (h === hEst) return; // se completa solo ("Activo")
      const label = document.createElement('label');
      label.className = 'label-title';
      label.textContent = h;
      form.appendChild(label);

      if (/dep[oó]sito/i.test(h)) {
        const select = document.createElement('select');
        select.name = h;
        depositos.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          select.appendChild(opt);
        });
        form.appendChild(select);
      } else {
        const inp = document.createElement('input');
        inp.placeholder = 'Ingrese ' + h;
        inp.name = h;
        if (h.toLowerCase().includes('cantidad') || h === hMin) {
          inp.type = 'number';
          inp.min = '0';
          inp.value = '0';
        }
        form.appendChild(inp);
      }
    });

    const b = document.createElement('button');
    b.type = 'submit';
    b.className = 'btn-main';
    b.textContent = '💾 Guardar Nuevo Producto';
    form.appendChild(b);

    form.onsubmit = async e => {
      e.preventDefault();
      const valores = encabezados.map(h => {
        if (h === hEst) return 'Activo';
        const elem = e.target.elements[h];
        return elem ? elem.value : '';
      });
      if (await enviar({ accion: 'agregar', valores })) {
        form.reset();
        cargar();
      }
    };
  }

  // ----- arranque -----
  cargar();
</script>
</body>
